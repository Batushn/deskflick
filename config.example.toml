# deskflick configuration
# Copy to ~/.config/deskflick/config.toml and edit. Restart deskflick to apply:
#   systemctl --user restart deskflick

[trigger]
# Which mouse button starts a gesture while held.
# Common values: "BTN_SIDE" (back / button 4), "BTN_EXTRA" (forward / button 5),
# "BTN_MIDDLE". Any evdev name works, including KEY_* for mice whose extra
# buttons send keyboard macros from their onboard profile — those are only
# honoured on the mouse itself, never on your real keyboard.
button = "BTN_SIDE"

# What each press pattern should do. Every one of these accepts:
#   "passthrough" — replay the button's original action (click or macro)
#   "overview"    — the shortcut set in [overview] below (show all windows)
#   "none"        — nothing
#   any KWin shortcut name, e.g. "Toggle Overview" or "Window Maximize"
#   "cmd:<shell command>", e.g. "cmd:notify-send hi"
tap = "passthrough"      # one quick press
double = "none"          # two quick presses
hold = "none"            # button kept down without flicking

# A tap is only a tap if released within this long.
tap_timeout_ms = 350
# Second press must land within this to count as a double tap. While `double`
# is "none" taps fire instantly; otherwise each tap waits out this window.
double_ms = 250
# How long the button must stay down before `hold` fires. Flicking afterwards
# still switches desktops.
hold_ms = 500

[gesture]
# How far (in mouse counts, ~pixels) you must push before a switch fires.
# Lower = more sensitive.
threshold = 150

# Keep switching desktops if you keep pushing while holding the button.
repeat = true

# Minimum time between two switches in one gesture.
cooldown_ms = 180

# Freeze the pointer while the trigger button is held.
lock_pointer = true

# Flip directions if you prefer "natural" scrolling semantics.
invert_x = false
invert_y = false

[actions]
# Each direction runs a KWin global shortcut by name (see:
#   gdbus call --session --dest org.kde.kglobalaccel \
#     --object-path /component/kwin \
#     --method org.kde.kglobalaccel.Component.shortcutNames
# ), or an arbitrary command with the "cmd:" prefix.
left  = "Switch One Desktop to the Left"
right = "Switch One Desktop to the Right"
up    = "Switch One Desktop Up"
down  = "Switch One Desktop Down"

# Examples:
# up   = "Toggle Overview"
# down = "cmd:notify-send 'flick!'"

[overview]
# Shortcut invoked when tap = "overview" above. "ExposeAll" is Present Windows
# (All desktops), the Ctrl+F10 effect; other ideas: "Overview", or "Expose"
# for the current desktop only.
shortcut = "ExposeAll"

[modifier]
# Hold this key as well as the trigger button, and flicks act on the focused
# window instead of switching desktops — the Meta + arrow keys behaviour.
# Reading the keyboard's modifier state needs `input` group membership, so log
# out and back in once after installing. Nothing but this one key's state is
# ever looked at, and keyboards are not opened at all while this is false.
enabled = false
key = "KEY_LEFTMETA"     # or KEY_LEFTCTRL / KEY_LEFTALT / KEY_LEFTSHIFT
                         # the right-hand twin of the key counts too

left  = "Window Quick Tile Left"
right = "Window Quick Tile Right"
up    = "Window Quick Tile Top"
down  = "Window Quick Tile Bottom"

# KWin opens the application launcher when Meta is released on its own, and
# deskflick swallows the button that would normally prevent that. This taps
# Ctrl (which does nothing by itself) to mark the modifier as used.
defuse_launcher = true
